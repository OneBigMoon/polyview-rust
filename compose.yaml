services:
  polyview:
    build: .
    ports:
      - "${POLYVIEW_PORT:-8080}:8080"
    user: "${POLYVIEW_UID:-1000}:${POLYVIEW_GID:-1000}"
    environment:
      POLYVIEW_BIND: "0.0.0.0:8080"
      POLYVIEW_DATA_DIR: "/data"
      POLYVIEW_MEDIA_DIR: "/media"
      POLYVIEW_SECURE_COOKIE: "${POLYVIEW_SECURE_COOKIE:-false}"
      POLYVIEW_PUBLIC_URL: "${POLYVIEW_PUBLIC_URL:-}"
      RUST_LOG: "${RUST_LOG:-polyview=info}"
    volumes:
      - type: bind
        source: "${POLYVIEW_DATA_DIR:-./data}"
        target: /data
      - type: bind
        source: "${POLYVIEW_MEDIA_DIR:-./media}"
        target: /media
    restart: unless-stopped
